<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AXIS ERP">
  <!--
    Marca do AXIS, redesenhada em vetor a partir do logotipo da empresa:
    disco verde com anel dourado, o "A" atravessado pela orbita e o "I" ao
    centro.

    O original e um render com relevo e brilhos - bonito em grande, papa em 32
    pixeis. Aqui ficam as mesmas formas reduzidas ao que ainda se le pequeno.
    O mesmo desenho vive em src/components/AxisLogo.tsx, para o ecra de login;
    este ficheiro existe a parte porque o favicon tem de ser um ficheiro.

    Cores da marca, nao do tema: a paleta muda por cliente, o logotipo nao.
  -->
  <defs>
    <linearGradient id="ouro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0dfa0" />
      <stop offset="50%" stop-color="#cfa94e" />
      <stop offset="100%" stop-color="#a3792a" />
    </linearGradient>
  </defs>

  <circle cx="16" cy="16" r="15" fill="#1e5b3a" />
  <circle cx="16" cy="16" r="15" fill="none" stroke="url(#ouro)" stroke-width="2" />
  <circle cx="16" cy="16" r="12.4" fill="none" stroke="url(#ouro)" stroke-width="0.7" opacity="0.85" />

  <g fill="none" stroke="url(#ouro)" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="16" cy="16.2" rx="9.8" ry="5.4" stroke-width="1.6" transform="rotate(-14 16 16.2)" />
    <path d="M10.4 22.6 L16 8.8 L21.6 22.6" stroke-width="2.1" />
    <path d="M13.7 22.6 H18.3 M16 22.6 V15.2 M14.3 15.2 H17.7" stroke-width="1.8" />
  </g>
</svg>
