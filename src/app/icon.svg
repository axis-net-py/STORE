<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AXIS ERP">
  <!--
    Monograma do AXIS ERP.

    O ícone anterior era um carrinho de compras: dizia "loja", e a mesma build
    serve hoje o agronegócio e a saúde. Um cliente do farm ou do clinic tinha
    um carrinho no separador do navegador.

    Fica o "A" da marca sobre grafite. Neutro de propósito: a cor do sistema
    muda por cliente (src/lib/tema.ts) e o favicon é o mesmo para todos — se
    acompanhasse a paleta não haveria um ícone de marca, haveria quatro. O
    dourado é o que já vinha do ícone antigo e é o que se mantém dele.

    A travessa do "A" atravessa e sai à direita: é o eixo que dá nome ao
    produto, e distingue o monograma de um "A" qualquer num tamanho em que
    quase tudo se parece.
  -->
  <defs>
    <linearGradient id="fundo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243141" />
      <stop offset="100%" stop-color="#131c26" />
    </linearGradient>
    <linearGradient id="marca" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e098" />
      <stop offset="50%" stop-color="#d4a843" />
      <stop offset="100%" stop-color="#a77a1d" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#fundo)" />

  <g fill="none" stroke="url(#marca)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- pernas do A -->
    <path d="M8.5 24.5 L16 7.5 L23.5 24.5" />
    <!-- travessa, prolongada como eixo -->
    <path d="M11.9 17.6 H26" />
  </g>
</svg>
